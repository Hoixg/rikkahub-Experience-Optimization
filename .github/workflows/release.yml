name: Release APKs

on:
  push:
    tags:
      - '2.5.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail
          version_name=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"/\1/p' app/build.gradle.kts | head -n 1)
          version_code=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)/\1/p' app/build.gradle.kts | head -n 1)
          test "$version_name" = "$GITHUB_REF_NAME"
          test -n "$version_code"
          git fetch origin custom
          git merge-base --is-ancestor HEAD FETCH_HEAD
          echo "Building $version_name (versionCode $version_code)"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare signing and Google Services
        shell: bash
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          for name in KEY_BASE64 SIGNING_CONFIG GOOGLE_SERVICES_JSON; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done
          printf '%s' "$KEY_BASE64" | base64 --decode > app/app.key
          printf '%s\n' "$SIGNING_CONFIG" > local.properties
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build signed release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain

      - name: Verify APKs and write checksums
        shell: bash
        run: |
          set -euo pipefail
          apk_dir=app/build/outputs/apk/release
          for name in app-arm64-v8a-release.apk app-universal-release.apk app-x86_64-release.apk; do
            test -s "$apk_dir/$name"
          done
          apksigner=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          test -n "$apksigner"
          for apk in "$apk_dir"/*.apk; do
            "$apksigner" verify "$apk"
          done
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path('app/build/outputs/apk/release/output-metadata.json').read_text())
          assert metadata['applicationId'] == 'me.rerere.rikkahub.custom'
          assert len(metadata['elements']) == 3
          assert all(item['versionName'] == os.environ['GITHUB_REF_NAME'] for item in metadata['elements'])
          PY
          (cd "$apk_dir" && sha256sum *.apk) > SHA256SUMS.txt

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          previous_tag=$(git tag --list '2.5.*' --sort=-v:refname | grep -Fxv "$GITHUB_REF_NAME" | head -n 1 || true)
          {
            echo "## RikkaHub Custom $GITHUB_REF_NAME"
            echo
            echo '包名：`me.rerere.rikkahub.custom`'
            echo
            echo '推荐大多数 Android 手机使用 `app-arm64-v8a-release.apk`；不确定架构时使用通用版。'
            echo
            if [ -n "$previous_tag" ]; then
              echo '## 更新内容'
              git log --first-parent --format='- %s' "$previous_tag..HEAD"
              echo
            fi
            echo '## SHA-256'
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: RikkaHub Custom ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            app/build/outputs/apk/release/*.apk
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
